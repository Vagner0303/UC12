 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
 </head>
 <body>

    <!-- Tag para formulario -->
    <form action="">
        <h2> Formulario de cadastro </h2>
        <label for="nome"> Nome </label> <!-- Da um titulo para o campo abaixo -->
        <input type="text" name="nome" id=""> <!-- Input é o campo onde vamos descrever algo -->

        <label for="email"> Email </label>
        <input type="email" name="email" id="">

        <label for="senha"> Senha </label>
        <input type="password" name="senha" id="">
<hr>
        <br><label for="escolhas"> Escolhas </label>
        <input type="checkbox" name="escolhas" value="js" id="">JS
        <input type="checkbox" name="escolhas" value="html" id="">HTML
        <input type="checkbox" name="escolhas" value="css" id="">CSS </br>
<hr>
        <br><label for="Sexo"> Generos </label>
        <input type="radio" name="Sexo" value="masculino" id="">Masculino 
        <input type="radio" name="Sexo" value="feminino" id="">Feminino </br>

<hr>
        <label for="curso"> Curso desejado:</label><br>
        <select name="curso" id="">
            <option value="html">HTML</option>
            <option value="js">JS</option>
            <option value="css">CSS</option>

        </select>

        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="" cols="20" rows="4"></textarea>

        <!-- Data de Nascimento -->
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" name="nascimento" id="">

        <!-- Este botao é obrigatorio para o funcionamento do formulario -->
        <button type="submit">Enviar</button>

    </form>


 </body>
 </html>
